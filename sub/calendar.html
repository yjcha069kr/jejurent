<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 공통 필터박스 */
.custom-date-box {
    position: relative;
}

.date-display {
    width: 100%;
    padding: 14px 20px;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid #ddd;
    cursor: pointer;
    background-color: #fff;
    color: #333;
}

/* 달력 */
.calendar {
    position: absolute;
    top: 50px;
    left: 0;
    width: 280px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    z-index: 100;
    padding: 15px;
    user-select: none;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-weight: bold;
    color: #ff5000;
}

.calendar-header button {
    background: #ff5000;
    border: none;
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
    padding: 6px 12px;
    font-weight: bold;
}

.calendar-body {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    text-align: center;
    color: #333;
}

.calendar-day {
    font-weight: bold;
    color: #ff5000;
}

.calendar-date {
    padding: 8px 0;
    border-radius: 6px;
    cursor: pointer;
}

.calendar-date:hover {
    background-color: #ff5000;
    color: #fff;
}

.calendar-date.selected {
    background-color: #ff7333;
    color: #fff;
    font-weight: bold;
}

    </style>
</head>
<body>
    <section class="section section-1" id="search">
    <div class="container">
        <div class="section-header">
            <span class="section-sub">SEARCH</span>
            <h2>원하시는 조건을 선택해 주세요</h2>
        </div>
        <div class="search-filter-bar">
            <!-- 인수 일시 -->
            <div class="filter-box custom-date-box" id="pickup-box">
                <label>인수 일시</label>
                <input type="text" readonly placeholder="날짜 선택" class="date-display">
                <div class="calendar" style="display:none;">
                    <div class="calendar-header">
                        <button class="prev-month">&lt;</button>
                        <span class="month-year"></span>
                        <button class="next-month">&gt;</button>
                    </div>
                    <div class="calendar-body"></div>
                </div>
            </div>

            <!-- 반납 일시 -->
            <div class="filter-box custom-date-box" id="return-box">
                <label>반납 일시</label>
                <input type="text" readonly placeholder="날짜 선택" class="date-display">
                <div class="calendar" style="display:none;">
                    <div class="calendar-header">
                        <button class="prev-month">&lt;</button>
                        <span class="month-year"></span>
                        <button class="next-month">&gt;</button>
                    </div>
                    <div class="calendar-body"></div>
                </div>
            </div>

            <!-- 보험 -->
            <div class="filter-box" id="insurance-box">
                <label>보험</label>
                <span class="value-display"><span>*</span> 종류 선택</span>
                <div class="detail-popup" id="insurance-popup">
                    <ul class="option-list">
                        <li>일반자차</li>
                        <li>고급자차</li>
                        <li>완전자차</li>
                    </ul>
                </div>
            </div>

            <!-- 운전자 연령 -->
            <div class="filter-box" id="age-box">
                <label>운전자 연령</label>
                <span class="value-display"><span>*</span> 연령 선택</span>
                <div class="detail-popup" id="age-popup">
                    <ul class="option-list">
                        <li>만 21세 - 22세</li>
                        <li>만 23세 - 25세</li>
                        <li>만 25세 이상</li>
                    </ul>
                </div>
            </div>

            <a href="/sub/rent.html"><button class="search-button">검색</button></a>
        </div>
    </div>
</section>

<script>
    document.querySelectorAll('.custom-date-box').forEach(box => {
    const dateDisplay = box.querySelector('.date-display');
    const calendar = box.querySelector('.calendar');
    const monthYear = calendar.querySelector('.month-year');
    const prevBtn = calendar.querySelector('.prev-month');
    const nextBtn = calendar.querySelector('.next-month');
    const calendarBody = calendar.querySelector('.calendar-body');

    const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];
    let currentDate = new Date();

    function renderCalendar(date) {
        calendarBody.innerHTML = '';

        // 요일
        daysOfWeek.forEach(day => {
            const dayEl = document.createElement('div');
            dayEl.textContent = day;
            dayEl.classList.add('calendar-day');
            calendarBody.appendChild(dayEl);
        });

        const year = date.getFullYear();
        const month = date.getMonth();
        monthYear.textContent = `${year}년 ${month+1}월`;

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month+1, 0).getDate();

        for (let i = 0; i < firstDay; i++) calendarBody.appendChild(document.createElement('div'));

        for (let i = 1; i <= lastDate; i++) {
            const dateEl = document.createElement('div');
            dateEl.textContent = i;
            dateEl.classList.add('calendar-date');
            dateEl.addEventListener('click', () => {
                dateDisplay.value = `${year}-${(month+1).toString().padStart(2,'0')}-${i.toString().padStart(2,'0')}`;
                hideCalendar();
            });
            calendarBody.appendChild(dateEl);
        }
    }

    function showCalendar() { calendar.style.display = 'block'; }
    function hideCalendar() { calendar.style.display = 'none'; }

    dateDisplay.addEventListener('click', e => {
        e.stopPropagation();
        if (calendar.style.display === 'block') hideCalendar();
        else { renderCalendar(currentDate); showCalendar(); }
    });

    prevBtn.addEventListener('click', e => { e.stopPropagation(); currentDate.setMonth(currentDate.getMonth()-1); renderCalendar(currentDate); });
    nextBtn.addEventListener('click', e => { e.stopPropagation(); currentDate.setMonth(currentDate.getMonth()+1); renderCalendar(currentDate); });

    document.addEventListener('click', e => { if (!box.contains(e.target)) hideCalendar(); });
});

</script>
</body>
</html>
