<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 날짜 선택 박스 */
.custom-date-box {
    position: relative;
    width: 280px;
}

.date-display {
    width: 100%;
    padding: 14px 20px;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid #ddd;
    cursor: pointer;
    background: #fff;
}

/* 달력 */
.calendar {
    position: absolute;
    top: 55px;
    left: 0;
    width: 280px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    padding: 15px;
    display: none;
    z-index: 100;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-weight: bold;
    color: #ff5000;
}

.calendar-header button {
    background: #ff5000;
    border: none;
    color: #fff;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
}

.calendar-body {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    text-align: center;
}

.calendar-day {
    font-weight: bold;
    color: #ff5000;
}

.calendar-date {
    padding: 8px 0;
    border-radius: 6px;
    cursor: pointer;
}

.calendar-date:hover {
    background: #ff5000;
    color: #fff;
}
    </style>
</head>
<body>
    <!-- 날짜 선택 박스 -->
<div class="custom-date-box">
    <label>날짜 선택</label>
    <input type="text" readonly placeholder="날짜 선택" class="date-display">

    <div class="calendar">
        <div class="calendar-header">
            <button class="prev-month">&lt;</button>
            <span class="month-year"></span>
            <button class="next-month">&gt;</button>
        </div>

        <div class="calendar-body"></div>
    </div>
</div>

<script>
    document.querySelectorAll('.custom-date-box').forEach(box => {
    const input = box.querySelector('.date-display');
    const calendar = box.querySelector('.calendar');
    const body = box.querySelector('.calendar-body');
    const monthYear = box.querySelector('.month-year');
    const prevBtn = box.querySelector('.prev-month');
    const nextBtn = box.querySelector('.next-month');

    const days = ['일', '월', '화', '수', '목', '금', '토'];
    let currentDate = new Date();

    function renderCalendar(date) {
        body.innerHTML = '';

        days.forEach(d => {
            const el = document.createElement('div');
            el.textContent = d;
            el.className = 'calendar-day';
            body.appendChild(el);
        });

        const year = date.getFullYear();
        const month = date.getMonth();
        monthYear.textContent = `${year}년 ${month + 1}월`;

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            body.appendChild(document.createElement('div'));
        }

        for (let i = 1; i <= lastDate; i++) {
            const dateEl = document.createElement('div');
            dateEl.textContent = i;
            dateEl.className = 'calendar-date';

            dateEl.onclick = () => {
                input.value = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                calendar.style.display = 'none';
            };

            body.appendChild(dateEl);
        }
    }

    input.addEventListener('click', e => {
        e.stopPropagation();
        calendar.style.display = calendar.style.display === 'block' ? 'none' : 'block';
        renderCalendar(currentDate);
    });

    prevBtn.onclick = e => {
        e.stopPropagation();
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar(currentDate);
    };

    nextBtn.onclick = e => {
        e.stopPropagation();
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar(currentDate);
    };

    document.addEventListener('click', e => {
        if (!box.contains(e.target)) calendar.style.display = 'none';
    });
});

</script>
</body>
</html>
